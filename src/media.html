<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Faibilo Desktop Widget</title>
    <link rel="stylesheet" href="./media.css" />
  </head>
  <body class="menu-closed">
    <div class="widget-wrapper animate-appear">
      <button type="button" id="diskBtn" class="disk-button logo-mode" aria-label="Toggle controls">
        <div class="disk-outer-ring"></div>
        <div class="disk-vinyl-sheen"></div>
        <span class="disk-center"></span>
        <div id="diskCover" class="disk-cover" style="background-image: url('./assets/Faibilo-logo.png')"></div>
        <div class="disk-equalizer" id="diskEqualizer" aria-hidden="true">
          <span class="eq-bar"></span>
          <span class="eq-bar"></span>
          <span class="eq-bar"></span>
        </div>
      </button>
 
      <div id="miniPlayer" class="mini-player hidden" aria-hidden="true">
        <div class="mini-player-glow"></div>
        <!-- Media Controls Section (Hidden by default) -->
        <div id="mediaControlsSection" class="hidden">
          <div class="player-header">
            <div class="track-info">
              <div class="track-source-row">
                <span class="live-dot"></span>
                <span class="track-source" id="mediaSource">Playing Media</span>
              </div>
              <div class="track-title-container">
                <h4 class="track-title" id="mediaTitle">No Media Playing</h4>
              </div>
            </div>
            <div class="header-actions">
              <button type="button" id="goTabBtn" class="go-tab-button" title="Go to Playing Page">
                <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
              </button>
              <button type="button" id="closeBtn" class="close-button" title="Close Menu">
                <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
              </button>
            </div>
          </div>
 
          <div class="player-controls">
            <button type="button" id="prevBtn" class="control-btn prev-btn" title="Previous Track">
              <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="5" x2="5" y2="19"></line></svg>
            </button>
            <button type="button" id="playPauseBtn" class="control-btn play-pause-btn" title="Play/Pause">
              <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="currentColor" class="play-icon"><polygon points="6 4 20 12 6 20 6 4"></polygon></svg>
              <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="currentColor" class="pause-icon hidden"><rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect></svg>
            </button>
            <button type="button" id="nextBtn" class="control-btn next-btn" title="Next Track">
              <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>
            </button>
          </div>
        </div>
 
        <!-- Search Section (Visible by default) -->
        <div id="searchSection" class="search-section">
          <div class="search-header">
            <div class="search-title-row">
              <span class="search-badge-icon">⚡</span>
              <span class="search-section-title">Quick Search</span>
            </div>
            <button type="button" id="searchCloseBtn" class="close-button" title="Close Menu">
              <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
          </div>
          <form id="widgetSearchForm" class="widget-search-form">
            <span class="search-lens-icon">
              <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </span>
            <input type="text" id="widgetSearchInput" placeholder="Search or type URL..." autocomplete="off" spellcheck="false" />
            <button type="submit" id="widgetSearchBtn" class="search-submit-btn" title="Search">
              <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            </button>
          </form>
        </div>
 
        <div class="player-footer">
          <label class="toggle-widget-row" title="Toggle desktop disc visibility">
            <span class="custom-switch">
              <input type="checkbox" id="widgetToggle" checked />
              <span class="switch-slider"></span>
            </span>
            <span class="toggle-label">Desktop disc active</span>
          </label>
        </div>
      </div>
    </div>
 
    <script>
      const diskBtn = document.getElementById('diskBtn');
      const diskCover = document.getElementById('diskCover');
      const miniPlayer = document.getElementById('miniPlayer');
      const mediaTitle = document.getElementById('mediaTitle');
      const mediaSource = document.getElementById('mediaSource');
      const playPauseBtn = document.getElementById('playPauseBtn');
      const closeBtn = document.getElementById('closeBtn');
      const searchCloseBtn = document.getElementById('searchCloseBtn');
      const nextBtn = document.getElementById('nextBtn');
      const prevBtn = document.getElementById('prevBtn');
      const goTabBtn = document.getElementById('goTabBtn');
      const widgetToggle = document.getElementById('widgetToggle');
      const widgetSearchForm = document.getElementById('widgetSearchForm');
      const widgetSearchInput = document.getElementById('widgetSearchInput');
 
      const playIcon = playPauseBtn.querySelector('.play-icon');
      const pauseIcon = playPauseBtn.querySelector('.pause-icon');
 
      let isMenuOpen = false;
      let isPlaying = false;
      let isForcedSearch = false;
      let animationFrameId = null;
      let rotationAngle = 0;
      const AUTO_CLOSE_MS = 5000;
      let autoCloseTimer = null;
      let autoCloseMode = null;

      const searchSection = document.getElementById('searchSection');
      const mediaControlsSection = document.getElementById('mediaControlsSection');

      const THEME_DEFAULTS = {
        forest:   { accent: '#8be2bf', bg: '#070a08', panel: '#151d19', border: '#2f4039' },
        midnight: { accent: '#7aa7ff', bg: '#070912', panel: '#11182b', border: 'rgba(227, 235, 255, 0.14)' },
        carbon:   { accent: '#dadde2', bg: '#090a0b', panel: '#181a1c', border: 'rgba(245, 247, 250, 0.13)' },
        sunrise:  { accent: '#ffb15d', bg: '#0d0a07', panel: '#211814', border: 'rgba(255, 238, 218, 0.15)' }
      };

      let currentAccentRgb = [139, 226, 191];

      function hexToRgb(hex) {
        if (!hex || typeof hex !== 'string') return null;
        const clean = hex.replace('#', '').trim();
        if (clean.length === 3) {
          const r = parseInt(clean[0] + clean[0], 16);
          const g = parseInt(clean[1] + clean[1], 16);
          const b = parseInt(clean[2] + clean[2], 16);
          return [r, g, b];
        }
        if (clean.length === 6) {
          const r = parseInt(clean.slice(0, 2), 16);
          const g = parseInt(clean.slice(2, 4), 16);
          const b = parseInt(clean.slice(4, 6), 16);
          return [r, g, b];
        }
        return null;
      }

      function hexToRgba(hex, alpha = 0.92) {
        const rgb = hexToRgb(hex);
        if (!rgb) return hex;
        return `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${alpha})`;
      }

      function applyAppearance(appearance) {
        if (!appearance || typeof appearance !== 'object') return;
        const theme = appearance.themePreset || 'forest';
        document.documentElement.dataset.theme = theme;
        const def = THEME_DEFAULTS[theme] || THEME_DEFAULTS.forest;

        const accent = appearance.accentColor || def.accent;
        if (accent) {
          document.documentElement.style.setProperty('--accent', accent);
          const rgb = hexToRgb(accent);
          if (rgb) {
            currentAccentRgb = rgb;
            document.documentElement.style.setProperty('--accent-glow', `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, 0.35)`);
            document.documentElement.style.setProperty('--accent-glow-subtle', `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, 0.15)`);
          }
        }

        const panel = appearance.componentBgColor || def.panel;
        if (panel) {
          document.documentElement.style.setProperty('--bg-card', hexToRgba(panel, 0.92));
        }

        const border = appearance.borderColor || def.border;
        if (border) {
          document.documentElement.style.setProperty('--border-card', border);
        }
      }

      function isSearchSectionVisible() {
        return isMenuOpen && searchSection && !searchSection.classList.contains('hidden');
      }

      function isMediaControlsVisible() {
        return isMenuOpen && mediaControlsSection && !mediaControlsSection.classList.contains('hidden');
      }

      function clearAutoCloseTimer() {
        if (autoCloseTimer) {
          clearTimeout(autoCloseTimer);
          autoCloseTimer = null;
        }
        autoCloseMode = null;
      }

      function resetSearchIdleTimer() {
        if (!isMenuOpen || autoCloseMode !== 'idle-search') return;
        if (autoCloseTimer) clearTimeout(autoCloseTimer);
        autoCloseTimer = setTimeout(() => {
          if (isMenuOpen && isSearchSectionVisible()) toggleMenu(false);
        }, AUTO_CLOSE_MS);
      }

      function scheduleAutoClose() {
        clearAutoCloseTimer();
        if (!isMenuOpen) return;

        if (isSearchSectionVisible()) {
          autoCloseMode = 'idle-search';
          resetSearchIdleTimer();
          return;
        }

        if (isMediaControlsVisible()) {
          autoCloseMode = 'fixed-mini';
          autoCloseTimer = setTimeout(() => {
            if (isMenuOpen && isMediaControlsVisible()) toggleMenu(false);
          }, AUTO_CLOSE_MS);
        }
      }

      function noteSearchActivity() {
        if (autoCloseMode === 'idle-search') resetSearchIdleTimer();
      }
 
      function updateAudioGlow() {
        if (!isPlaying) {
          animationFrameId = null;
          return;
        }
 
        const now = Date.now() / 1000;
        
        // Procedural audio simulation:
        // Bass beat (BPM around 125 => ~2.08 Hz)
        const bass = Math.pow(Math.sin(now * Math.PI * 2.08), 6);
        // Treble flutter (higher frequency noise)
        const treble = Math.sin(now * Math.PI * 18) * 0.08 + Math.random() * 0.08;
        // Mid range melody wave (slower modulation)
        const mid = Math.sin(now * Math.PI * 0.7) * 0.12;
        
        // Combined level (ranges from ~0.35 to 1.0)
        const level = 0.4 + bass * 0.42 + treble + mid;
        
        // Dynamic styling for disk glow
        const glowOpacity = 0.25 + level * 0.55; // 0.25 to 0.8
        const glowSpread = 10 + Math.round(level * 22); // 10px to 32px
        
        const [ar, ag, ab] = currentAccentRgb;
        diskBtn.style.boxShadow = `
          inset 0 0 10px rgba(0, 0, 0, 0.8),
          0 8px 24px rgba(0, 0, 0, 0.5),
          0 0 ${glowSpread}px rgba(${ar}, ${ag}, ${ab}, ${glowOpacity})
        `;
        diskBtn.style.borderColor = `rgba(${ar}, ${ag}, ${ab}, ${0.3 + level * 0.55})`;
 
        // Dynamic styling for mini player glow if open
        if (isMenuOpen) {
          miniPlayer.style.boxShadow = `
            0 10px 25px rgba(0, 0, 0, 0.5),
            0 0 ${glowSpread + 4}px rgba(${ar}, ${ag}, ${ab}, ${glowOpacity * 0.65}),
            inset 0 1px 0 rgba(255, 255, 255, 0.05)
          `;
          miniPlayer.style.borderColor = `rgba(${ar}, ${ag}, ${ab}, ${0.16 + level * 0.45})`;
        } else {
          miniPlayer.style.boxShadow = '';
          miniPlayer.style.borderColor = '';
        }
 
        // Spin rotation (speeds up slightly on beats!)
        const spinSpeed = 0.45 + level * 1.35; // base spin speed + beat speed multiplier
        rotationAngle = (rotationAngle + spinSpeed) % 360;
        diskCover.style.transform = `rotate(${rotationAngle}deg)`;
 
        animationFrameId = requestAnimationFrame(updateAudioGlow);
      }
 
      function resetWidgetToDefault() {
        isPlaying = false;
        diskBtn.classList.add('logo-mode');
        diskBtn.classList.remove('spinning');
        diskCover.style.backgroundImage = 'url("./assets/Faibilo-logo.png")';
        diskCover.style.transform = '';
        diskBtn.style.boxShadow = '';
        diskBtn.style.borderColor = '';
        miniPlayer.style.boxShadow = '';
        miniPlayer.style.borderColor = '';
        mediaTitle.textContent = 'No Media Playing';
        mediaSource.textContent = 'Playing Media';
        playIcon.classList.remove('hidden');
        pauseIcon.classList.add('hidden');
        mediaControlsSection.classList.add('hidden');
        searchSection.classList.remove('hidden');
        rotationAngle = 0;

        if (animationFrameId) {
          cancelAnimationFrame(animationFrameId);
          animationFrameId = null;
        }

        if (isMenuOpen) {
          isForcedSearch = false;
          document.body.className = 'menu-open';
          scheduleAutoClose();
        } else {
          isForcedSearch = false;
          document.body.className = 'menu-closed';
          clearAutoCloseTimer();
        }
      }

      function toggleMenu(open) {
        isMenuOpen = (open !== undefined) ? open : !isMenuOpen;

        if (!isMenuOpen) {
          clearAutoCloseTimer();
          isForcedSearch = false;
          // Restore correct panels based on current exists state
          const exists = !diskBtn.classList.contains('logo-mode');
          if (exists) {
            mediaControlsSection.classList.remove('hidden');
            searchSection.classList.add('hidden');
          } else {
            mediaControlsSection.classList.add('hidden');
            searchSection.classList.remove('hidden');
          }
        }
 
        document.body.className = isMenuOpen ? (isPlaying ? 'menu-open playing-active' : 'menu-open') : 'menu-closed';
        
        if (isMenuOpen) {
          miniPlayer.classList.remove('hidden');
          miniPlayer.setAttribute('aria-hidden', 'false');
          if (!searchSection.classList.contains('hidden')) {
            setTimeout(() => {
              widgetSearchInput.focus();
              noteSearchActivity();
            }, 150);
          }
          scheduleAutoClose();
        } else {
          setTimeout(() => {
            if (!isMenuOpen) miniPlayer.classList.add('hidden');
          }, 200);
          miniPlayer.setAttribute('aria-hidden', 'true');
        }
 
        window.faibilo.setMediaMenuOpen(isMenuOpen);
      }
 
      let hasMoved = false;
      let dragStartPos = null;

      diskBtn.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return; // Left click dragging only
        dragStartPos = { x: e.screenX, y: e.screenY };
        hasMoved = false;

        window.faibilo.startMediaWidgetDrag();

        const onMouseMove = (moveEvent) => {
          const dx = moveEvent.screenX - dragStartPos.x;
          const dy = moveEvent.screenY - dragStartPos.y;
          if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
            hasMoved = true;
            window.faibilo.dragMediaWidget(dx, dy);
          }
        };

        const onMouseUp = () => {
          document.removeEventListener('mousemove', onMouseMove);
          document.removeEventListener('mouseup', onMouseUp);
        };

        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
      });

      diskBtn.addEventListener('click', (e) => {
        if (hasMoved) {
          e.preventDefault();
          e.stopPropagation();
          return;
        }
        toggleMenu();
      });
      diskBtn.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        if (!isMenuOpen) {
          isForcedSearch = true;
          mediaControlsSection.classList.add('hidden');
          searchSection.classList.remove('hidden');
          toggleMenu(true);
        } else {
          toggleMenu(false);
        }
      });
      closeBtn.addEventListener('click', () => toggleMenu(false));
      searchCloseBtn.addEventListener('click', () => toggleMenu(false));
 
      playPauseBtn.addEventListener('click', () => {
        window.faibilo.sendMediaControl('play-pause');
      });
 
      nextBtn.addEventListener('click', () => {
        window.faibilo.sendMediaControl('next');
      });
 
      prevBtn.addEventListener('click', () => {
        window.faibilo.sendMediaControl('prev');
      });
 
      goTabBtn.addEventListener('click', () => {
        window.faibilo.sendMediaControl('go-to-tab');
      });
 
      widgetToggle.addEventListener('change', (e) => {
        if (!e.target.checked) {
          window.faibilo.sendMediaSettings(false);
        }
      });
 
      // Click-through window management: only the circle button and expanded panel are touchable
      function isPointInCircle(x, y, element) {
        const rect = element.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const r = rect.width / 2;
        const dx = x - cx;
        const dy = y - cy;
        return (dx * dx + dy * dy) <= r * r;
      }

      function isPointInRect(x, y, element) {
        if (!element || element.classList.contains('hidden')) return false;
        const rect = element.getBoundingClientRect();
        return x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom;
      }

      let lastIgnoreState = null;
      function updateMouseIgnore(clientX, clientY) {
        const overDisk = isPointInCircle(clientX, clientY, diskBtn);
        const overPlayer = isPointInRect(clientX, clientY, miniPlayer);
        const shouldIgnore = !(overDisk || overPlayer);
        
        if (shouldIgnore !== lastIgnoreState) {
          lastIgnoreState = shouldIgnore;
          if (shouldIgnore) {
            window.faibilo.setIgnoreMouseEvents(true, { forward: true });
          } else {
            window.faibilo.setIgnoreMouseEvents(false);
          }
        }
      }

      window.addEventListener('mousemove', (e) => {
        updateMouseIgnore(e.clientX, e.clientY);
        if (isSearchSectionVisible() && isPointInRect(e.clientX, e.clientY, searchSection)) {
          noteSearchActivity();
        }
      });

      searchSection.addEventListener('mousedown', noteSearchActivity);
      searchSection.addEventListener('mousemove', noteSearchActivity);
      widgetSearchInput.addEventListener('input', noteSearchActivity);
      widgetSearchInput.addEventListener('keydown', noteSearchActivity);
      widgetSearchInput.addEventListener('focus', noteSearchActivity);
      widgetSearchForm.addEventListener('mousedown', noteSearchActivity);

      // Ensure that if the mouse leaves the document entirely, we set ignore to true
      document.addEventListener('mouseleave', () => {
        if (lastIgnoreState !== true) {
          lastIgnoreState = true;
          window.faibilo.setIgnoreMouseEvents(true, { forward: true });
        }
      });

      // Set initial ignore state on load
      window.faibilo.setIgnoreMouseEvents(true, { forward: true });
      lastIgnoreState = true;
 
      widgetSearchForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const query = widgetSearchInput.value.trim();
        if (query) {
          window.faibilo.searchFromWidget(query);
          widgetSearchInput.value = '';
          toggleMenu(false);
        } else {
          noteSearchActivity();
        }
      });
 
      window.faibilo.onMediaSettingsChange((enabled) => {
        if (widgetToggle) widgetToggle.checked = Boolean(enabled);
      });

      window.faibilo.onWindowAppear(() => {
        if (widgetToggle) widgetToggle.checked = true;
        const wrapper = document.querySelector('.widget-wrapper');
        if (wrapper) {
          wrapper.classList.remove('animate-appear');
          void wrapper.offsetWidth; // force reflow
          wrapper.classList.add('animate-appear');
        }
      });
 
      window.faibilo.onMediaState((state) => {
        if (!state) return;
        
        const exists = Boolean(state.exists);
        isPlaying = Boolean(state.playing);

        if (!exists) {
          resetWidgetToDefault();
          return;
        }

        // Switch to Media Mode
        diskBtn.classList.remove('logo-mode');

        mediaTitle.textContent = state.title || 'No Media Playing';
        if (state.url) {
          try {
            const hostname = new URL(state.url).hostname;
            mediaSource.textContent = hostname.replace('www.', '');
          } catch {
            mediaSource.textContent = 'Playing Media';
          }
        } else {
          mediaSource.textContent = 'Playing Media';
        }

        if (state.thumbnail) {
          diskCover.style.backgroundImage = `url("${state.thumbnail.replace(/"/g, '%22')}")`;
        } else {
          diskCover.style.backgroundImage = 'none';
        }

        // Only switch visible panels if not forced into search mode while menu is open
        if (!isMenuOpen || !isForcedSearch) {
          mediaControlsSection.classList.remove('hidden');
          searchSection.classList.add('hidden');
        }

        if (isMenuOpen) scheduleAutoClose();

        if (isPlaying) {
          diskBtn.classList.add('spinning');
          if (isMenuOpen) document.body.className = 'menu-open playing-active';
          else document.body.className = 'menu-closed';
          playIcon.classList.add('hidden');
          pauseIcon.classList.remove('hidden');

          if (!animationFrameId) {
            updateAudioGlow();
          }
        } else {
          diskBtn.classList.remove('spinning');
          if (isMenuOpen) document.body.className = 'menu-open';
          else document.body.className = 'menu-closed';
          playIcon.classList.remove('hidden');
          pauseIcon.classList.add('hidden');

          if (animationFrameId) {
            cancelAnimationFrame(animationFrameId);
            animationFrameId = null;
          }
          diskBtn.style.boxShadow = '';
          diskBtn.style.borderColor = '';
          diskCover.style.transform = '';
          miniPlayer.style.boxShadow = '';
          miniPlayer.style.borderColor = '';
        }

        if ('menuOpen' in state && state.menuOpen !== isMenuOpen) {
          toggleMenu(state.menuOpen);
        }
      });

      // Synchronize customization appearance with main browser
      if (window.faibilo?.onMediaAppearance) {
        window.faibilo.onMediaAppearance((appearance) => {
          applyAppearance(appearance);
        });
      }

      if (window.faibilo?.getMediaAppearance) {
        window.faibilo.getMediaAppearance().then((app) => {
          if (app) applyAppearance(app);
        }).catch(() => {});
      } else if (window.faibilo?.getSettings) {
        window.faibilo.getSettings().then((st) => {
          if (st) applyAppearance(st);
        }).catch(() => {});
      }
    </script>
  </body>
</html>
